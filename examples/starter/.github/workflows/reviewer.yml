# GENERATED FROM harness.dot — DO NOT EDIT.
# Edit harness.dot / roles / foundry.config.yaml and run `gp-foundry build`.
name: reviewer
"on":
  pull_request:
    types:
      - opened
      - synchronize
      - ready_for_review
concurrency:
  group: reviewer-${{ github.event.pull_request.number }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  reviewer_guard:
    name: reviewer guard
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false && github.event.pull_request.user.login == 'agent-bot'
    permissions:
      contents: read
      pull-requests: read
    timeout-minutes: 5
    outputs:
      run: ${{ steps.scope.outputs.run }}
      reason: ${{ steps.scope.outputs.reason }}
      head_sha: ""
      diff_hash: ""
      started_at: ""
    steps:
      - name: Is this PR in scope?
        id: scope
        uses: thegpvc/gp-foundry/actions/pr-scope@v0.3.0
        with:
          number: ${{ github.event.pull_request.number }}
          token: ${{ github.token }}
          rollout: "{\"authors\":[]}"
          bot-login: agent-bot
          branch-prefix: agent/
  reviewer:
    runs-on: ubuntu-latest
    if: needs.reviewer_guard.outputs.run == 'true'
    permissions:
      contents: read
      pull-requests: write
      checks: read
    timeout-minutes: 25
    needs:
      - reviewer_guard
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.AGENT_PAT }}
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Checkout harness files (base ref)
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          path: .gp-foundry/harness
          fetch-depth: 1
          sparse-checkout: |-
            .github/agent-setup
            .github/agents
          token: ${{ secrets.AGENT_PAT }}
          persist-credentials: false
      - name: Keep the harness copy out of the working tree
        shell: bash
        run: |-
          mkdir -p .git/info
          echo "/.gp-foundry/" >> .git/info/exclude
      - name: Setup agent toolchain
        uses: ./.gp-foundry/harness/.github/agent-setup
      - name: Fetch context
        id: ctx
        uses: thegpvc/gp-foundry/actions/agent-context@v0.3.0
        with:
          type: pr-diff
          number: ${{ github.event.pull_request.number }}
          token: ${{ secrets.AGENT_PAT }}
          checks-token: ${{ github.token }}
          trusted-authors: agent-bot
          trusted-framing: baseline
      - name: Run agent
        timeout-minutes: 15
        uses: thegpvc/gp-foundry/actions/run-agent@v0.3.0
        with:
          role-file: .gp-foundry/harness/.github/agents/roles/reviewer.md
          model: claude-opus-4-8
          comms-file: .gp-foundry/harness/.github/agents/communication.md
          scope-path: .gp-foundry/harness/.github/agents/scope.yaml
          claude-code-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github-token: ${{ secrets.AGENT_PAT }}
          context-file: ${{ steps.ctx.outputs.context-file }}
