name: supervisor
"on":
  schedule:
    - cron: 17 * * * *
  workflow_dispatch: {}
concurrency:
  group: supervisor
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  supervisor:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: write
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.AGENT_PAT }}
          fetch-depth: 0
      - name: Configure git identity
        shell: bash
        env:
          GIT_NAME: Agent Bot
          GIT_EMAIL: agent-bot@users.noreply.github.com
        run: |-
          git config user.name "$GIT_NAME"
          git config user.email "$GIT_EMAIL"
      - name: Setup agent toolchain
        uses: ./.github/agent-setup
      - name: Run agent
        id: agent
        timeout-minutes: 10
        uses: thegpvc/gp-foundry/actions/run-agent@v1
        with:
          role-file: .github/agents/roles/supervisor.md
          model: claude-opus-4-8
          comms-file: .github/agents/communication.md
          scope-path: .github/agents/scope.yaml
          claude-code-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github-token: ${{ secrets.AGENT_PAT }}
      - name: Strip protected paths, commit, push
        uses: thegpvc/gp-foundry/actions/agent-fallback@v1
        with:
          branch: main
          base-branch: main
          token: ${{ secrets.AGENT_PAT }}
          agent-name: supervisor
          scope-path: .github/agents/scope.yaml
          commit-message: "chore(supervisor): scheduled update"
      - name: Create recovery branch
        id: recovery
        if: ${{ !cancelled() && steps.agent.outcome == 'failure' }}
        shell: bash
        env:
          PREFIX: agent/
          NODE: supervisor
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |-
          BRANCH="$PREFIX$NODE-recovery-$RUN_ID-$RUN_ATTEMPT"
          git checkout -b "$BRANCH"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
      - name: Preserve failed agent output for review
        if: ${{ !cancelled() && steps.agent.outcome == 'failure' && steps.recovery.outcome == 'success' }}
        uses: thegpvc/gp-foundry/actions/agent-fallback@v1
        with:
          branch: ${{ steps.recovery.outputs.branch }}
          base-branch: main
          token: ${{ secrets.AGENT_PAT }}
          agent-name: supervisor
          scope-path: .github/agents/scope.yaml
          pr-title: "supervisor: recover incomplete scheduled output"
          pr-body: "Partial output from a failed `supervisor` run. Review for completeness before merging. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          pr-label: needs-human
