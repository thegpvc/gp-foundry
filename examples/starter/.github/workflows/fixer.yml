# GENERATED FROM harness.dot — DO NOT EDIT.
# Edit harness.dot / roles / foundry.config.yaml and run `gp-foundry build`.
name: fixer
"on":
  pull_request_review:
    types:
      - submitted
concurrency:
  group: fixer-${{ github.event.pull_request.number }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  fixer_guard:
    name: fixer guard
    runs-on: ubuntu-latest
    if: (contains(github.event.review.body, '**Verdict:** REQUEST_CHANGES') && github.event.review.user.login == 'agent-bot') && github.event.pull_request.draft == false && github.event.pull_request.user.login == 'agent-bot'
    permissions:
      contents: read
      pull-requests: read
    timeout-minutes: 5
    outputs:
      run: ${{ steps.scope.outputs.run }}
      reason: ${{ steps.scope.outputs.reason }}
      head_sha: ""
      diff_hash: ""
      started_at: ""
    steps:
      - name: Is this a PR the pipeline wrote?
        id: scope
        uses: thegpvc/gp-foundry/actions/pr-scope@v0.8.0
        with:
          number: ${{ github.event.pull_request.number }}
          token: ${{ github.token }}
          rollout: "{\"authors\":[]}"
          bot-login: agent-bot
          branch-prefix: agent/
          require-agent-written: "true"
  fixer:
    runs-on: ubuntu-latest
    if: needs.fixer_guard.outputs.run == 'true'
    permissions:
      contents: write
      pull-requests: write
      checks: read
    timeout-minutes: 35
    needs:
      - fixer_guard
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.AGENT_PAT }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Configure git identity
        shell: bash
        env:
          GIT_NAME: Agent Bot
          GIT_EMAIL: agent-bot@users.noreply.github.com
        run: |-
          git config user.name "$GIT_NAME"
          git config user.email "$GIT_EMAIL"
      - name: Checkout harness files (base ref)
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          path: .gp-foundry/harness
          fetch-depth: 1
          sparse-checkout: |-
            .github/agent-setup
            .github/agents
          token: ${{ secrets.AGENT_PAT }}
          persist-credentials: false
      - name: Keep the harness copy out of the working tree
        shell: bash
        run: |-
          mkdir -p .git/info
          echo "/.gp-foundry/" >> .git/info/exclude
      - name: Use this PR's harness files if the base ref has no harness yet
        shell: bash
        env:
          HARNESS: .gp-foundry/harness
          SPEC: .github/harness.dot
          DIRS: |-
            .github/agent-setup
            .github/agents
        run: |-
          if [ -f "$HARNESS/$SPEC" ]; then exit 0; fi
          echo "::notice::the base ref has no harness yet ($SPEC) — using this pull request's own harness files. This only happens while the harness itself is being installed."
          while IFS= read -r D; do
            [ -n "$D" ] && [ -d "$D" ] || continue
            mkdir -p "$HARNESS/$(dirname "$D")"
            rm -rf "${HARNESS:?}/$D"
            cp -R "$D" "$HARNESS/$D"
          done <<< "$DIRS"
      - name: Enforce attempt budget (max 3)
        id: attempts
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.AGENT_PAT }}
          PR: ${{ github.event.pull_request.number }}
          MARKER: <!-- gp-foundry:attempt:fixer -->
          MAX: "3"
          BOT_LOGIN: agent-bot
        run: |-
          # One request-changes verdict = one attempt. The jq filter reads the bot
          # login from the environment (never interpolated into the script), and an
          # empty BOT_LOGIN counts any reviewer's request-changes.
          # (--paginate emits one count per page, so the counts are summed.)
          COUNT=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/reviews" --paginate --jq '
            [ .[]
              | select(env.BOT_LOGIN == "" or .user.login == env.BOT_LOGIN)
              | select(.state == "CHANGES_REQUESTED" or ((.body // "") | test("Verdict.*REQUEST_CHANGES")))
            ] | length' 2>/dev/null | awk '{s+=$1} END {print s+0}')
          [ -n "$COUNT" ] || COUNT=0
          echo "attempts so far: $COUNT / $MAX"
          # The label and the comments are the visible record, not the control flow:
          # a failure to write one (a token without the scope, a transient API error)
          # is a warning, and the decision — stop, or run the attempt — still stands.
          if [ "$COUNT" -gt "$MAX" ]; then
            echo "exhausted=true" >> "$GITHUB_OUTPUT"
            gh pr edit "$PR" --add-label "needs-human" 2>/dev/null \
              || gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR/labels" -f 'labels[]=needs-human' >/dev/null \
              || echo "::warning::could not label #$PR 'needs-human' — the attempt budget is exhausted all the same"
            gh pr comment "$PR" --body "$(printf '## ⛔ Attempt budget (fixer)\n\nExhausted (%s/%s requested-changes rounds) — labeling `needs-human` and stopping. A human should take this over.\n\n%s' "$COUNT" "$MAX" "$MARKER")" >/dev/null \
              || echo "::warning::could not post the exhaustion notice on #$PR"
          else
            echo "exhausted=false" >> "$GITHUB_OUTPUT"
            gh pr comment "$PR" --body "$(printf '%s attempt %s of %s' "$MARKER" "$COUNT" "$MAX")" >/dev/null \
              || echo "::warning::could not post the attempt marker on #$PR (attempt $COUNT/$MAX is counted all the same; the count comes from the reviews)"
          fi
      - name: Setup agent toolchain
        if: steps.attempts.outputs.exhausted != 'true'
        uses: ./.gp-foundry/harness/.github/agent-setup
      - name: Fetch context
        id: ctx
        if: steps.attempts.outputs.exhausted != 'true'
        uses: thegpvc/gp-foundry/actions/agent-context@v0.8.0
        with:
          type: pr-review
          number: ${{ github.event.pull_request.number }}
          token: ${{ secrets.AGENT_PAT }}
          checks-token: ${{ github.token }}
          trusted-authors: agent-bot
      - name: Run agent
        if: steps.attempts.outputs.exhausted != 'true'
        timeout-minutes: 25
        uses: thegpvc/gp-foundry/actions/run-agent@v0.8.0
        with:
          role-file: .gp-foundry/harness/.github/agents/roles/fixer.md
          model: claude-opus-4-8
          comms-file: .gp-foundry/harness/.github/agents/communication.md
          scope-path: .gp-foundry/harness/.github/agents/scope.yaml
          claude-code-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github-token: ${{ secrets.AGENT_PAT }}
          context-file: ${{ steps.ctx.outputs.context-file }}
      - name: Commit and push fixes
        if: steps.attempts.outputs.exhausted != 'true' && !cancelled()
        shell: bash
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |-
          # An untracked scratch draft at the root (a PR body or reply written for
          # --body-file) is not part of the fix: drop it rather than commit it.
          while IFS= read -r f; do
            case "$f" in
              */*) ;;
              .pr-body*|pr-body*|.pr_body*|pr_body*|PR_BODY*|.pr-description*|pr-description*|.issue-comment*|issue-comment*|.comment-body*|.review-body*)
                echo "::warning::'$f' looks like an agent's scratch file — not committing it"
                rm -f -- "$f" ;;
            esac
          done < <(git ls-files --others --exclude-standard)
          # Commit anything the agent left uncommitted...
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "agent fix: fixer"
          fi
          # ...then push if HEAD is ahead of the remote (the agent may have committed itself).
          git fetch origin "$BRANCH" --quiet 2>/dev/null || true
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse "origin/$BRANCH" 2>/dev/null || echo none)" ]; then
            git push origin "HEAD:$BRANCH"
            echo "pushed fix to $BRANCH"
          else
            echo "no changes to push"
          fi
