name: retro
"on":
  schedule:
    - cron: 0 7 * * 1-5
  workflow_dispatch: {}
concurrency:
  group: retro
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  retro:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: write
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.AGENT_PAT }}
          fetch-depth: 0
      - name: Configure git identity
        shell: bash
        env:
          GIT_NAME: Agent Bot
          GIT_EMAIL: agent-bot@users.noreply.github.com
        run: |-
          git config user.name "$GIT_NAME"
          git config user.email "$GIT_EMAIL"
      - name: Setup agent toolchain
        uses: ./.github/agent-setup
      - name: Run agent
        uses: thegpvc/gp-foundry/actions/run-agent@v1
        with:
          role-file: .github/agents/roles/retro.md
          model: claude-opus-4-8
          comms-file: .github/agents/communication.md
          scope-path: .github/agents/scope.yaml
          claude-code-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github-token: ${{ secrets.AGENT_PAT }}
      - name: Strip protected paths, commit, push
        uses: thegpvc/gp-foundry/actions/agent-fallback@v1
        with:
          branch: main
          base-branch: main
          token: ${{ secrets.AGENT_PAT }}
          agent-name: retro
          scope-path: .github/agents/scope.yaml
          commit-message: "chore(retro): scheduled update"
