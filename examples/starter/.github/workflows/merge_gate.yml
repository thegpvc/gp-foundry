name: merge_gate
"on":
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}
  pull_request:
    types:
      - synchronize
      - reopened
      - ready_for_review
      - labeled
      - unlabeled
      - review_requested
      - review_request_removed
  pull_request_review:
    types:
      - submitted
      - dismissed
concurrency:
  group: ${{ github.event.pull_request.number && format('merge_gate-pr-{0}', github.event.pull_request.number) || 'merge_gate' }}
  cancel-in-progress: ${{ github.event.pull_request.number != null }}
permissions:
  contents: read
jobs:
  merge_gate:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event.pull_request.state == 'open' && github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
    permissions:
      contents: read
      pull-requests: read
      checks: write
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          token: ${{ github.token }}
          persist-credentials: false
      - name: Evaluate merge gate (publish check, never merge)
        uses: thegpvc/gp-foundry/actions/merge-gate@v0.3.2
        with:
          merge: "off"
          check-name: gp-foundry/approval (merge_gate)
          token: ${{ github.token }}
          checks-token: ${{ github.token }}
          policy-path: .github/agents/policy/merge.yaml
          base-branch: main
          bot-login: agent-bot
          rollout: "{\"authors\":[]}"
          pr-number: ${{ github.event.pull_request.number }}
