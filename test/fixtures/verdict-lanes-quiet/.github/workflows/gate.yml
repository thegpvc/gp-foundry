name: gate
"on":
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      pr:
        description: "Evaluate just this PR (a quiet verdict's nudge); empty: the full pass"
        required: false
        type: string
      reason:
        description: "With pr: why the approver has no verdict yet, shown on a head that has none"
        required: false
        type: string
      reason_sha:
        description: "With reason: the head it was given for"
        required: false
        type: string
  pull_request:
    types:
      - synchronize
      - reopened
      - ready_for_review
      - labeled
      - unlabeled
      - review_requested
      - review_request_removed
  pull_request_review:
    types:
      - submitted
      - dismissed
concurrency:
  group: ${{ (github.event.pull_request.number || inputs.pr) && format('gate-pr-{0}', (github.event.pull_request.number || inputs.pr)) || 'gate' }}
  cancel-in-progress: ${{ (github.event.pull_request.number || inputs.pr) && true || false }}
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event.pull_request.state == 'open' && github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' && github.event.pull_request.draft == false && (github.event.pull_request.user.type != 'Bot' || github.event.pull_request.user.login == 'agent-app[bot]'))
    permissions:
      contents: read
      actions: write
    timeout-minutes: 10
    steps:
      - name: Mint app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.AGENT_APP_ID }}
          private-key: ${{ secrets.AGENT_APP_PRIVATE_KEY }}
      - name: Checkout
        uses: actions/checkout@v5
        with:
          token: ${{ github.token }}
          ref: main
          persist-credentials: false
      - name: Evaluate merge gate (publish check, merge agent-written PRs)
        id: gate
        uses: thegpvc/gp-foundry/actions/merge-gate@fixture-ref
        with:
          merge: agent-only
          check-name: gp-foundry/approval (gate)
          job-check-name: gate
          gate-workflow: .github/workflows/gate.yml
          token: ${{ steps.app-token.outputs.token }}
          checks-token: ${{ steps.app-token.outputs.token }}
          check-app: ${{ steps.app-token.outputs.app-slug }}
          policy-path: .github/agents/policy/merge.yaml
          base-branch: main
          verdict-checks: gp-foundry/verdict (approver)
          verdict-app: agent-app
          bot-login: agent-app[bot]
          rereview-label: re-review
          pr-number: ${{ github.event.pull_request.number || inputs.pr }}
          waiting-title: ${{ inputs.reason }}
          waiting-sha: ${{ inputs.reason_sha }}
          rotation-period-seconds: "600"
          time-budget-seconds: "480"
      - name: Wake downstream workflows
        if: ${{ !cancelled() && steps.gate.outputs.published-prs != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PRS: ${{ steps.gate.outputs.published-prs }}
          DISPATCH_TARGETS: formal-approval.yml pr
          BASE_BRANCH: main
        run: |-
          # dispatch=: start each target now rather than at its next scheduled run, with
          # the job's own GITHUB_TOKEN (workflow_dispatch is the one event it can start).
          # A "pr" target runs once per PR, with the PR as its `pr` input; any other once.
          # A sweep runs for the PR when one changed, and as one full sweep when several
          # did (a scheduled pass): one run of its own LIMIT, not a run per PR.
          # Best effort: a failed dispatch is a warning.
          ERR=$(mktemp)
          start() { # <workflow> [pr]
            local ARGS=(-f ref="$BASE_BRANCH")
            if [ -n "${2:-}" ]; then ARGS+=(-f "inputs[pr]=$2"); fi
            if gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/$1/dispatches" "${ARGS[@]}" > /dev/null 2> "$ERR"; then
              echo "started $1${2:+ for #$2}"
