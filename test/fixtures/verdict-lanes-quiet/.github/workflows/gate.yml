              pr) for N in "${CHANGED[@]}"; do start "$WF" "$N"; done ;;
              sweep) if [ "${#CHANGED[@]}" -eq 1 ]; then start "$WF" "${CHANGED[0]}"; else start "$WF"; fi ;;
              *) start "$WF" ;;
            esac
          done <<< "$DISPATCH_TARGETS"
