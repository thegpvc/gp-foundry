# policy/merge.yaml — the merge-gate's policy. Read by the runtime-core merge-gate
# action and evaluated into a {merge | skip | label} decision + audit comment.
#
# IMPORTANT: these are FLAT snake_case keys (normalized to camelCase at runtime).
# The action reads exactly these names — do not nest them under approval:/ci:/etc.

# Only consider PRs whose head branch starts with this prefix.
branch_prefix: "agent/"

# Approval — the Reviewer posts its verdict in a review BODY (a bot can't formally
# APPROVE its own PR). A body is a verdict when its LAST non-empty line, trimmed, is
# exactly `**Verdict:** APPROVE` / `REQUEST_CHANGES` / `ESCALATE` — the words come from
# `verdicts:` in foundry.config.yaml, and the sweep reads the same grammar, so leave the
# markers unset. Setting a regex here overrides that marker and can drift from the sweep.
# approval_body_regex: '(?:^|\n)[ \t]*\*\*Verdict:\*\* APPROVE[ \t]*$'
# WHO may approve. An approval is an instruction to push to the base branch, so the
# gate only counts verdicts it can attribute: the reviewer bot itself (bot_login —
# the compiler passes identity.bot_login for you), or a review from someone with
# write access. Reviews are bound to the head SHA: approve, push, and the approval
# stops counting. Plain issue comments are NOT an approval channel unless you turn
# them on below — anyone who can comment could type the verdict string, and a comment
# carries no SHA to bind to.
trusted_author_associations: [OWNER, MEMBER, COLLABORATOR]
allow_comment_approvals: false
# Checks that must be PRESENT and green on the head SHA (not just green if they ran).
# A human-gate node's approval check goes here — `gp-foundry build` wires it in.
# An entry may pin the author as "<name>@<app-slug>": a check-run's name is public,
# so anything that can write checks could otherwise publish its own "approval".
required_checks: []
# A rejection verdict INVALIDATES earlier approvals (latest verdict wins). The default,
# derived from the request-changes word in `verdicts:`, is deliberately looser than the
# approval marker: a rejection the gate fails to recognize leaves an earlier approval
# standing, so it matches the marker anywhere on a line. It cannot misread an approval
# that mentions the earlier request in prose — the approval marker is tested first.
# rejection_body_regex: "Verdict.*REQUEST_CHANGES"
approval_delay_minutes: 0        # cool-off after approval before auto-merge (0 = none)

# CI — require the check rollup to be passing; optionally ignore named checks.
require_ci: true
ci_ignore_check_names: []

# Size — hand-written additions cap; over this, label for a human instead of merging.
# exclude_globs discount generated files/lockfiles from the count.
max_additions: 800
exclude_globs:
  - "**/__pycache__/**"

# Protected paths — touching any of these blocks auto-merge (labels needs-human).
protected_paths:
  - ".github/"
# Files left out of the protected-path check only (e.g. tests under a protected package).
# They still count towards max_additions. Default: none.
# protected_path_exclude_globs:
#   - "**/*_test.go"

# Rebase / conflicts.
#  - require_clean_rebase: false — GitHub's mergeable_state is computed async and races
#    on fresh PRs; instead we let the merge ATTEMPT fail and react (see rebase_label).
#  - rebase_label: applied when a merge attempt fails on a conflict; the 🧹 Janitor
#    (scheduled sweep) picks up this label, rebases, and de-labels.
require_clean_rebase: false
rebase_label: needs-rebase

# Merge — squash, NOT rebase: the Janitor resolves conflicts with a merge commit, and a
# rebase-merge cannot rebase a branch containing merge commits.
merge_method: squash
delete_branch_on_merge: true

# A PR already carrying one of these is skipped (the Janitor/human owns it, not the gate).
blocking_labels:
  - needs-human
  - needs-rebase

# Labels applied on a skip outcome, so skips route to the right owner.
labels:
  needs_human: needs-human       # too-large / protected-path
  rebase_needed: needs-rebase    # proactive rebase label (used if require_clean_rebase: true)

# ── Evaluate-mode clauses (all off by default) ─────────────────────────────────
# Useful with a merge-gate node carrying mode="evaluate", which publishes this
# policy's result as a check run on every head each tick instead of merging. They
# apply in merge mode too when set.
#
# Fail (`open-threads`) while a review thread is open: unresolved, the PR author has
# not replied in it or reacted to its first comment, and it was not opened by the
# author. A thread opened by one of bot_logins blocks only when its first comment
# matches bot_thread_blocking_regex (a bot's P2 nit never blocks).
# require_no_open_threads: true
# bot_logins: ["greptile-apps[bot]", "cursor[bot]"]
# bot_thread_blocking_regex: "P1|High Severity"
#
# What the check says for a head the approver has not given a verdict on yet (no
# approve, reject or escalate): failure (default) or neutral ("Awaiting the approver"),
# which keeps a red X off every PR the approver has not decided. The neutral summary
# still lists every other failing clause (CI, threads, review requests, size).
# no_verdict_conclusion: neutral
#
# Fail (`review-requested`) while a reviewer or team is still requested.
# require_no_review_requests: true
#
# Fail (`changes-requested`) while any PERSON's review stands at "changes requested".
# Without it the latest verdict wins, so a later approval from the bot overrides a
# teammate's block; with it the block holds until they approve or it is dismissed.
# require_no_human_changes_requested: true
#
# Labels that hand a PR to a person outright: never merged, and in evaluate mode the
# check is `action_required`, whether or not the approver has given a verdict.
# (`blocking_labels` only hold a merge back; these say who decides.)
# escalation_labels: [needs-human-decision]
#
# Policy handoffs (the gate's check only). These clauses mean "a person should look",
# not "something is broken": while one fails on its own the check is action_required.
# A formal approval of the head from anyone other than identity.bot_login, with
# GitHub's own review decision met (required approvals, code owners), signs it off and
# the check reports whatever else the policy says. The gate never merges on a sign-off.
# handoff_clauses: [protected-path, too-large]
#
# The trusted reviewer's latest verdict on the head being an escalation turns the check
# `action_required` (a human decides). Defaults to the exact `**Verdict:** ESCALATE`
# line; this key only overrides it.
# escalation_body_regex: '(?:^|\n)[ \t]*\*\*Verdict:\*\* ESCALATE[ \t]*$'
