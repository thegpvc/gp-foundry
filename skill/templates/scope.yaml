# scope.yaml — the invariants from interview Q2. Canonical, CI-enforced.
# immutable_paths: agents can NEVER modify these. Three things enforce it, and
#   `gp-foundry build` wires up all three: the generated immutable-guard.yml fails
#   any agent-branch PR whose diff touches one, agent-fallback strips such edits
#   before a lane pushes (including the scheduled lanes that commit straight to the
#   base branch), and the merge gate holds back a PR that reaches it anyway. This
#   is the hard safety boundary.
# forbidden_paths / forbidden_operations: prompt-enforced (softer); an improve/gardener lane
#   may adjust these, but never immutable_paths.

immutable_paths:                 # enforced by CI check, never modifiable by agents
  - .github/workflows/           # the generated harness itself — agents must not self-edit YAML
  # - <add paths that must never change, e.g. infra, secrets config>

forbidden_paths:                 # prompt-enforced, adjustable by a maintenance lane
  # - <e.g. terraform/>

forbidden_operations:
  # - <e.g. infrastructure changes>

guidance:                        # soft guidance injected into every agent's prompt
  - prefer small, focused changes
  - when in doubt, open a draft PR and explain what's left
  # closes the Retro's learning loop: lessons it distills are read before working
  - "before implementing, check .github/agents/memory/topics/ for relevant prior lessons"
