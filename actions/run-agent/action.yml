name: Run Agent
description: >-
  Assemble a prompt file in a documented order and run the Claude Code CLI
  headlessly through stdin. Captures stderr and propagates agent failures so
  workflows can recover partial work without reporting a false success.

inputs:
  role-file:
    description: >-
      Path to the role / job-description markdown file. This is the first
      section of the assembled prompt and is required — it defines what the
      agent is.
    required: true
  prompt-override-file:
    description: >-
      Optional path to a task-specific prompt file appended after the role.
      When present its contents replace/augment the default instructions for
      this invocation.
    required: false
    default: ""
  context-file:
    description: >-
      Optional path to a file holding the runtime context (issue body, PR diff,
      review comments, etc.) produced by an upstream context-gathering step.
      Appended last so the agent sees its instructions before the payload.
    required: false
    default: ""
  conventions:
    description: >-
      Optional inline conventions/guardrails string (typically sourced from the
      foundry config JSON). Inserted between the prompt and the scope so repo
      conventions are stated once, centrally.
    required: false
    default: ""
  comms-file:
    description: >-
      Optional path to the team communication guide (tone, identity, handoff
      protocol). Included verbatim if the file exists, before the scope.
    required: false
    default: ".github/agents/communication.md"
  scope-path:
    description: >-
      Path to the scope config file (e.g. allowed paths / boundaries). Included
      verbatim if the file exists. Defaults to .github/agents/scope.yaml.
    required: false
    default: ".github/agents/scope.yaml"
  model:
    description: Model id passed to `claude --model` (e.g. an Opus or Sonnet id).
    required: true
  allowed-tools:
    description: >-
      Value for `claude --allowedTools` (comma-separated tool allowlist, e.g.
      "Read,Write,Edit,Glob,Grep,Bash(git:*)"). If empty, it is read from the
      role file's `tools:` front-matter, so tool policy lives in the role and is
      editable without a rebuild.
    required: false
    default: ""
  claude-code-oauth-token:
    description: >-
      Claude Code OAuth token. Composites have no secrets context, so this must
      be passed in explicitly by the caller.
    required: true
  github-token:
    description: >-
      Token for the agent's own `gh`/git operations (labels, comments, PRs).
      Exposed to the agent as GH_TOKEN/GITHUB_TOKEN. Without it, the agent's
      `gh` calls are unauthenticated.
    required: false
    default: ""
  extra-args:
    description: >-
      Optional extra arguments appended verbatim to the `claude` invocation
      (passthrough for flags like --max-turns, --add-dir, etc.).
    required: false
    default: ""
  max-attempts:
    description: >-
      How many times to run the CLI when it exits non-zero for a reason that is
      not the agent's fault — an overloaded or 5xx API response, a dropped
      connection. A genuine agent error is never retried, and neither is a
      usage/session limit, which clears on a wall-clock schedule rather than in
      seconds. Set to 1 to disable retrying.
    required: false
    default: "3"
  retry-base-delay-seconds:
    description: >-
      Seconds to wait before the second attempt. Each further attempt doubles
      it, so the default gives 15s and then 30s.
    required: false
    default: "15"
  extra-env:
    description: >-
      Optional newline-separated NAME=VALUE pairs exported into the agent's
      environment before the CLI runs, so roles can reach extra secrets (e.g. a
      Sentry token). Values are passed in by the caller because composites have
      no secrets context; the compiler fills these from config.agent.secrets, one
      NAME=<value> pair per line. Values are never echoed.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Assemble prompt
      id: assemble
      shell: bash
      env:
        ROLE_FILE: ${{ inputs.role-file }}
        PROMPT_OVERRIDE_FILE: ${{ inputs.prompt-override-file }}
        CONTEXT_FILE: ${{ inputs.context-file }}
        CONVENTIONS: ${{ inputs.conventions }}
        COMMS_FILE: ${{ inputs.comms-file }}
        SCOPE_PATH: ${{ inputs.scope-path }}
      run: |
        set -euo pipefail

        PROMPT_FILE="$(mktemp)"
        echo "prompt-file=${PROMPT_FILE}" >> "$GITHUB_OUTPUT"

        # Prompt is assembled in a fixed, documented order:
        #   1. role-file            (required — who the agent is)
        #   2. prompt-override-file (optional — the task instructions)
        #   3. conventions          (optional — repo guardrails from config)
        #   4. scope-path           (optional — path/boundary config)
        #   5. context-file         (optional — the runtime payload)

        # 1. role — include the BODY only. The YAML front-matter (role/type/tools/
        #    handoffs) is compiler metadata, not agent instructions; leaving it in
        #    the prompt makes models echo it back instead of acting.
        if [ ! -f "$ROLE_FILE" ]; then
          echo "::error::role-file not found: ${ROLE_FILE}"
          exit 1
        fi
        if head -1 "$ROLE_FILE" | grep -q '^---[[:space:]]*$'; then
          awk 'BEGIN{fm=0} /^---[[:space:]]*$/{fm++; next} fm>=2{print}' "$ROLE_FILE" >> "$PROMPT_FILE"
        else
          cat "$ROLE_FILE" >> "$PROMPT_FILE"
        fi
        printf '\n\n' >> "$PROMPT_FILE"

        # 2. prompt override
        if [ -n "$PROMPT_OVERRIDE_FILE" ] && [ -f "$PROMPT_OVERRIDE_FILE" ]; then
          cat "$PROMPT_OVERRIDE_FILE" >> "$PROMPT_FILE"
          printf '\n\n' >> "$PROMPT_FILE"
        fi

        # 3. conventions (inline string)
        if [ -n "$CONVENTIONS" ]; then
          printf '## Conventions\n\n' >> "$PROMPT_FILE"
          printf '%s\n\n' "$CONVENTIONS" >> "$PROMPT_FILE"
        fi

        # 3b. communication guide (tone / identity / handoff protocol)
        if [ -n "$COMMS_FILE" ] && [ -f "$COMMS_FILE" ]; then
          cat "$COMMS_FILE" >> "$PROMPT_FILE"
          printf '\n\n' >> "$PROMPT_FILE"
        elif [ -n "$COMMS_FILE" ]; then
          echo "::warning::comms-file '$COMMS_FILE' not found — agents will lack the communication guide"
        fi

        # 4. scope
        if [ -n "$SCOPE_PATH" ] && [ -f "$SCOPE_PATH" ]; then
          printf '## Scope\n\n' >> "$PROMPT_FILE"
          cat "$SCOPE_PATH" >> "$PROMPT_FILE"
          printf '\n\n' >> "$PROMPT_FILE"
        elif [ -n "$SCOPE_PATH" ]; then
          echo "::warning::scope-path '$SCOPE_PATH' not found — agents will run WITHOUT scope guardrails"
        fi

        # 5. context payload
        if [ -n "$CONTEXT_FILE" ] && [ -f "$CONTEXT_FILE" ]; then
          printf '## Context\n\n' >> "$PROMPT_FILE"
          cat "$CONTEXT_FILE" >> "$PROMPT_FILE"
          printf '\n' >> "$PROMPT_FILE"
        fi

        echo "::notice::Assembled prompt at ${PROMPT_FILE} ($(wc -c < "$PROMPT_FILE") bytes)"

    - name: Run agent
      shell: bash
      env:
        CLAUDE_CODE_OAUTH_TOKEN: ${{ inputs.claude-code-oauth-token }}
        GH_TOKEN: ${{ inputs.github-token }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        PROMPT_FILE: ${{ steps.assemble.outputs.prompt-file }}
        ROLE_FILE: ${{ inputs.role-file }}
        MODEL: ${{ inputs.model }}
        ALLOWED_TOOLS: ${{ inputs.allowed-tools }}
        EXTRA_ARGS: ${{ inputs.extra-args }}
        EXTRA_ENV: ${{ inputs.extra-env }}
        MAX_ATTEMPTS: ${{ inputs.max-attempts }}
        RETRY_BASE_DELAY_SECONDS: ${{ inputs.retry-base-delay-seconds }}
      run: |
        set -uo pipefail

        if [ -z "${CLAUDE_CODE_OAUTH_TOKEN}" ]; then
          echo "::error::claude-code-oauth-token is empty"
          exit 1
        fi

        # Export any caller-provided extra env (NAME=VALUE per line) so roles can reach
        # extra secrets (config.agent.secrets). Values are never echoed; GitHub also masks
        # registered secret values in logs. Split on the FIRST '=' so values may contain '='.
        if [ -n "${EXTRA_ENV:-}" ]; then
          while IFS= read -r _line; do
            [ -z "$_line" ] && continue
            _name="${_line%%=*}"
            _value="${_line#*=}"
            case "$_name" in
              [A-Za-z_][A-Za-z0-9_]*) export "$_name=$_value" ;;
              *) echo "::warning::run-agent: skipping malformed extra-env entry" ;;
            esac
          done <<< "$EXTRA_ENV"
          unset _line _name _value
        fi

        # Tool policy lives in the role front-matter. If allowed-tools was not
        # passed explicitly, read `tools: "..."` from the role file's YAML
        # front-matter so tools are editable content (no rebuild needed).
        if [ -z "${ALLOWED_TOOLS}" ] && [ -f "${ROLE_FILE}" ]; then
          ALLOWED_TOOLS="$(awk '
            /^---[[:space:]]*$/ { fm = (fm ? 2 : 1); next }
            fm == 1 && /^[[:space:]]*tools[[:space:]]*:/ {
              sub(/^[[:space:]]*tools[[:space:]]*:[[:space:]]*/, "")
              gsub(/^["'"'"']|["'"'"']$/, "")
              print; exit
            }
          ' "${ROLE_FILE}")"
        fi
        if [ -z "${ALLOWED_TOOLS}" ]; then
          echo "::warning::no allowed-tools input and no tools: in role front-matter; claude will use its defaults"
        fi

        STDERR_LOG="$(mktemp)"
        STDOUT_LOG="$(mktemp)"
        EXIT_FILE="$(mktemp)"

        # classify_failure names why an attempt died, read from the tail of what
        # the CLI produced. The CLI prints its terminal error last, so a bounded
        # window keeps an agent that merely *mentioned* rate limiting mid-run
        # from being mistaken for one that hit it.
        classify_failure() {
          combined="$(tail -n 20 "$1" 2>/dev/null; tail -n 20 "$2" 2>/dev/null)"

          # A usage wall clears at a wall-clock reset that is routinely tens of
          # minutes out — far past any step budget — so retrying here only burns
          # the runner. Terminal, but it gets its own message: this is a capacity
          # problem, and reading it as a broken agent sends people to the wrong
          # place. Observed shape: "You've hit your session limit · resets 9:20am (UTC)".
          if printf '%s' "$combined" | grep -qiE "hit your (session|usage) limit|usage limit reached|quota exceeded"; then
            printf 'quota'
            return
          fi

          # Server-side and connection failures clear in seconds. Observed shape:
          # "API Error: 529 Overloaded. This is a server-side issue, usually temporary".
          if printf '%s' "$combined" | grep -qiE "api error: 5[0-9]{2}|overloaded|internal server error|bad gateway|service unavailable|gateway timeout|connection (reset|refused|closed)|econnreset|etimedout|socket hang up|network error"; then
            printf 'transient'
            return
          fi

          printf 'fatal'
        }

        # Capture the agent's exit code instead of swallowing it: a dead agent must
        # be RED, not a green no-op — that's what lets a human (or the supervisor
        # sweep) notice and re-drive the work. Fallback steps in the generated
        # workflow run `if: !cancelled()`, so partial work is still salvaged.
        # stderr goes to a file (not streamed) so it surfaces as one grouped warning.
        #
        # Retrying assumes a role can be re-run, which the harness already relies
        # on everywhere else: the scheduled lanes re-run on their cron, agent_refire
        # re-fires label lanes, and the supervisor re-drives stranded work. Roles
        # are written to read current state (labels, existing PRs, prior comments)
        # before acting for exactly that reason. A consumer that has a lane where
        # that does not hold can set max-attempts: 1.
        AGENT_EXIT=0
        ATTEMPT=1
        DELAY="${RETRY_BASE_DELAY_SECONDS:-15}"

        while : ; do
          : > "$STDERR_LOG"
          : > "$STDOUT_LOG"

          if [ "$ATTEMPT" -gt 1 ]; then
            echo "::notice::run-agent: attempt ${ATTEMPT}/${MAX_ATTEMPTS}"
          fi

          # stdout is teed rather than redirected so a long run stays watchable
          # in the live log; the exit code travels out of the subshell in a file
          # because the pipeline would otherwise report tee's. `set +e` inside
          # the subshell is load-bearing: the step runs under `bash -e`, which
          # would otherwise abort the subshell at the failing CLI and never
          # reach the echo that records the code.
          # shellcheck disable=SC2086
          # The prompt goes in on stdin, not argv: Linux limits each argument to
          # 128 KiB and a large PR diff exceeds it.
          ( set +e
            claude -p \
              --model "$MODEL" \
              --allowedTools "$ALLOWED_TOOLS" \
              $EXTRA_ARGS \
              < "$PROMPT_FILE" 2> "$STDERR_LOG"
            echo $? > "$EXIT_FILE" ) | tee "$STDOUT_LOG"
          AGENT_EXIT="$(cat "$EXIT_FILE" 2>/dev/null || echo 1)"
          [ -n "$AGENT_EXIT" ] || AGENT_EXIT=1

          if [ -s "$STDERR_LOG" ]; then
            echo "::warning::Claude produced stderr output:"
            cat "$STDERR_LOG"
          fi

          if [ "$AGENT_EXIT" -eq 0 ]; then
            break
          fi

          FAILURE_CLASS="$(classify_failure "$STDOUT_LOG" "$STDERR_LOG")"

          if [ "$FAILURE_CLASS" = "quota" ]; then
            echo "::error::agent hit a usage or session limit — a capacity wall, not a code failure. It clears on a wall-clock reset well past this step's budget, so the attempt is not retried; re-drive the lane after the reset."
            break
          fi

          if [ "$FAILURE_CLASS" != "transient" ]; then
            break
          fi

          if [ "$ATTEMPT" -ge "$MAX_ATTEMPTS" ]; then
            echo "::error::agent hit a transient API failure on all ${MAX_ATTEMPTS} attempts — giving up"
            break
          fi

          echo "::warning::run-agent: transient API failure (exit ${AGENT_EXIT}); retrying in ${DELAY}s"
          sleep "$DELAY"
          ATTEMPT=$((ATTEMPT + 1))
          DELAY=$((DELAY * 2))
        done

        if [ "$AGENT_EXIT" -ne 0 ]; then
          echo "::error::agent exited with code $AGENT_EXIT — failing the step so the run is visibly red"
          exit "$AGENT_EXIT"
        fi
