name: "merge-gate"
description: >
  Evaluate a PR against a merge policy (bot-approval, CI, approval delay,
  hand-written diff size, protected paths, clean rebase) and either merge it,
  apply a routing label, or skip. Generalized port of the gp-dixie "Shipper".
author: "gp-foundry"

inputs:
  pr-number:
    description: >
      PR number to evaluate. When omitted, the action runs in POLLER mode:
      it discovers open candidate PRs and merges the first that qualifies.
    required: false
    default: ""
  token:
    description: >
      GitHub token with contents:write and pull-requests:write (a GitHub App
      installation token or a PAT so merges are attributed and events cascade).
    required: true
  policy-path:
    description: "Path to the merge policy file (YAML or JSON)."
    required: true
  base-branch:
    description: "Base branch to filter candidate PRs by (poller mode)."
    required: false
    default: "main"
  branch-prefix:
    description: >
      Only consider PRs whose head branch starts with this prefix (poller mode).
      Overrides the policy file's branchPrefix when set.
    required: false
    default: ""
  checks-token:
    description: >
      Token used ONLY to read the check-runs rollup for the head SHA. That read
      needs the Checks permission, which is a GitHub App permission — a
      fine-grained PAT cannot be granted it, so passing the harness PAT here 403s
      and the gate merges nothing. Pass the built-in GITHUB_TOKEN (an App
      installation token) and give the job `permissions: checks: read`. Defaults to `token`,
      which is correct only when that token is a GitHub App installation token.
    required: false
    default: ""
  bot-login:
    description: >
      Login of the reviewer bot whose verdicts this gate trusts. Overrides the
      policy file's bot_login. Verdicts from anyone else count only when their
      author_association is in the policy's trusted_author_associations
      (default: OWNER, MEMBER, COLLABORATOR).
    required: false
    default: ""
  required-checks:
    description: >
      Comma- or newline-separated check-run names that must be PRESENT and
      successful on the head SHA before merging. Unlike the CI rollup, a check
      that never reported blocks the merge — this is how an Environment approval
      job becomes a real precondition. Overrides the policy file's
      required_checks.
    required: false
    default: ""
  clean-rebase:
    description: >
      Optional override for the clean-rebase check: "true" or "false". When
      unset, the action infers it from the PR's mergeable state.
    required: false
    default: ""
  verdicts:
    description: >
      The verdict words, comma-separated, in order: approve, request changes,
      escalate (default "APPROVE,REQUEST_CHANGES,ESCALATE"). A review is a verdict
      when its last non-empty line, trimmed, is exactly "**Verdict:** <word>"; the
      approval, rejection and escalation markers default to those lines. The
      compiler passes foundry.config.yaml's `verdicts:` here.
    required: false
    default: ""
  mode:
    description: >
      "merge": merge the first qualifying PR, or label/skip. "evaluate":
      never merge or label — evaluate every open PR in scope and publish the
      result as one check run per head (named by check-name), updated in place
      each run and left alone when nothing changed. Evaluate mode needs only
      `checks: write`, `pull-requests: read` and `contents: read` on the token.
      No default here, so the action can tell whether a workflow set it: when
      neither `mode` nor `merge` is given, the gate runs as "merge". Do not set
      it together with `merge`.
    required: false
  merge:
    description: >
      The single gate. "off": judge every PR in scope and publish the result as
      a check on its head; never merge, label or comment. "agent-only": the
      same, and also act on the PRs the pipeline wrote (opened by bot-login,
      every commit its own) — merge when ready, apply the policy's labels when
      not. A human-written PR only ever gets the check. Scope comes from
      `rollout`, not from a branch prefix. Replaces `mode`; set one, not both.
    required: false
    default: ""
  rollout:
    description: >
      With `merge`: the rollout dial as JSON ({"authors":[...],"optInLabel":"...",
      "skipLabel":"..."}), written by the compiler from foundry.config.yaml.
      Empty means every PR is in scope. Drafts and other bots' PRs never are;
      PRs opened by bot-login always are.
    required: false
    default: ""
  check-app:
    description: >
      With `merge`: the slug of the app whose check runs this gate adopts and
      updates. Default "github-actions" (the gate publishes with GITHUB_TOKEN).
      When `checks-token` is the harness's App token, pass that App's slug: the
      check is then published by the App, and no other workflow's GITHUB_TOKEN
      can publish one this gate — or a ruleset pinned to the App — accepts.
    required: false
    default: ""
  job-check-name:
    description: >
      The check-run name GitHub Actions gives the gate's own job (its `name:`,
      else its job id); the compiler writes it. The gate's job sits on the PR's
      head during an event run, so the CI rollup leaves out every check run of
      this name written by github-actions — earlier runs of the gate, in
      progress, cancelled or timed out — as well as every job of the current
      workflow run (GITHUB_RUN_ID). A CI job of the same name in another
      workflow is left out too: keep the gate's job name distinct.
  verdict-checks:
    description: >
      Newline-separated names of the check runs that lanes with quiet_verdicts
      deliver a verdict as. Such a run counts as the bot's verdict on the head,
      at the time it completed, only when its app is `verdict-app` and its title
      is `Verdict: <WORD>`. The compiler writes it. Empty: off.
    required: false
    default: ""
  verdict-app:
    description: >
      With `verdict-checks`: the slug of the harness App, the only app whose
      verdict checks count.
    required: false
    default: ""
  rereview-label:
    description: >
      With `merge`: the label that asks for a fresh review and verdict on the
      head. While it is on a PR, only verdicts posted after it was added count;
      until one exists the gate's result is held at in progress and nothing is
      merged. Once one exists the gate removes the label. Empty: off.
    required: false
    default: ""
  rotation-period-seconds:
    description: >
      With `merge` and no `pr-number`: the schedule's period. The pass's window
      of 20 PRs advances once per period, computed from the clock — not from a
      run counter, which event runs of the same workflow also advance — so
      successive ticks cover every candidate without stored state. The compiler
      derives it from the node's cron. Default 300.
    required: false
    default: ""
  time-budget-seconds:
    description: >
      With `merge` and no `pr-number` (the scheduled pass): stop starting new
      evaluations after this many seconds, so the job finishes inside its own
      timeout. The compiler sets it from the job's timeout.
    required: false
    default: ""
  check-name:
    description: "With `merge`, or mode evaluate: the check run to publish on each head (required there)."
    required: false
    default: ""
  authors:
    description: "Evaluate mode: only PRs by these comma-separated logins (or carrying opt-in-label)."
    required: false
    default: ""
  opt-in-label:
    description: "Evaluate mode: with authors, a PR carrying this label is in scope whoever opened it."
    required: false
    default: ""
  skip-labels:
    description: "Evaluate mode: comma-separated labels; a PR carrying any is not evaluated."
    required: false
    default: ""
  skip-bot-authors:
    description: "Evaluate mode: 'true' leaves out PRs opened by a bot other than bot-login."
    required: false
    default: "false"
  dry-run:
    description: "When 'true', evaluate and emit outputs but perform no mutation."
    required: false
    default: "false"

outputs:
  action:
    description: "Decision: merge | skip | label."
  code:
    description: "Machine-stable reason code (e.g. ready-to-merge, too-large)."
  reason:
    description: "Human-readable explanation of the decision."
  label:
    description: "Label to apply, when action is 'label'."
  merged:
    description: "'true' if a PR was merged by this run, else 'false'."
  merged-pr:
    description: "The PR number that was merged, if any."
  evaluated:
    description: "Evaluate mode: how many PRs were evaluated."
  checks-written:
    description: "Evaluate mode: how many check runs were created or updated (unchanged ones are not written)."

runs:
  using: "node24"
  main: "dist/index.cjs"
