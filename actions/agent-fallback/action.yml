name: Agent Fallback
description: Safety net — strip protected paths, commit, push, and create a PR if the agent didn't.

inputs:
  branch:
    description: Branch name to push.
    required: true
  token:
    description: GitHub token used for push, PR creation, and comments.
    required: true
  agent-name:
    description: Agent name for fallback commit messages (e.g., implement, improve, fix).
    required: true
  base-branch:
    description: Base branch to diff against and target for the fallback PR.
    default: main
  scope-path:
    description: >-
      Path to the scope YAML file whose `immutable_paths:` list names paths the agent
      must never modify. These are stripped before pushing (a restricted token cannot
      push workflow changes). If the file or the key is absent, defaults to
      `.github/workflows/`.
    default: .github/agents/scope.yaml
  allowed-paths:
    description: >-
      Optional newline- or comma-separated allowlist of path prefixes this lane
      may write. When set, changes anywhere else are reverted before the push —
      the inverse of `immutable_paths`, for a lane whose remit is narrow (a
      scheduled agent that may only write its memory directory, say). Empty means
      "anywhere the immutable paths don't forbid".
    default: ""
  commit-message:
    description: Fallback commit message (if the agent left uncommitted changes).
    default: ""
  pr-title:
    description: Fallback PR title (empty = never create a fallback PR).
    default: ""
  pr-body:
    description: Fallback PR body.
    default: ""
  pr-label:
    description: Label for the fallback PR.
    default: ""
  issue-number:
    description: Issue to comment on with the PR link (and optional no-changes comment).
    default: ""
  no-changes-comment:
    description: Comment to post on PR/issue if no changes were made (empty = skip).
    default: ""
  comment-target:
    description: "Where to post no-changes-comment: 'pr' or 'issue'."
    default: "pr"

runs:
  using: composite
  steps:
    - name: Resolve immutable paths
      id: immutable
      shell: bash
      env:
        SCOPE_PATH: ${{ inputs.scope-path }}
      run: |
        # Extract the `immutable_paths:` list from the scope YAML without a YAML
        # parser. We read simple `- <path>` list items that follow the
        # `immutable_paths:` key, stopping at the next top-level key.
        PATHS=""
        if [ -f "$SCOPE_PATH" ]; then
          PATHS=$(awk '
            /^immutable_paths[[:space:]]*:/ { grab=1; next }
            grab {
              # A new top-level key (no leading whitespace, ends with ":") ends the list.
              if ($0 ~ /^[^[:space:]#][^:]*:/) { grab=0; next }
              # List item: "  - some/path"
              if ($0 ~ /^[[:space:]]*-[[:space:]]*/) {
                line=$0
                sub(/^[[:space:]]*-[[:space:]]*/, "", line)   # drop the "- " marker
                sub(/[[:space:]]*#.*$/, "", line)             # drop trailing comment
                gsub(/^[[:space:]]+|[[:space:]]+$/, "", line)  # trim
                gsub(/^["'\'']|["'\'']$/, "", line)            # drop surrounding quotes
                if (line != "") print line
              }
            }
          ' "$SCOPE_PATH")
        fi
        if [ -z "$PATHS" ]; then
          PATHS=".github/workflows/"
          echo "::notice::No immutable_paths found in '$SCOPE_PATH'; defaulting to .github/workflows/"
        fi
        # Serialize the (possibly multi-line) list into GITHUB_OUTPUT.
        {
          echo "paths<<__IMMUTABLE_EOF__"
          echo "$PATHS"
          echo "__IMMUTABLE_EOF__"
        } >> "$GITHUB_OUTPUT"

    - name: Strip protected path changes
      shell: bash
      env:
        BASE_BRANCH: ${{ inputs.base-branch }}
        IMMUTABLE_PATHS: ${{ steps.immutable.outputs.paths }}
        ALLOWED_PATHS: ${{ inputs.allowed-paths }}
      run: |
        # Revert any changes to immutable paths — the restricted App token
        # typically lacks permission to push them (e.g. `workflows`), so the
        # push would be rejected. The rule is one sentence: under an immutable
        # path, the tree must match the base branch EXACTLY — no matter whether
        # the agent committed the edit, staged it, or left it in the worktree.
        #
        # Restoring from the base (not from HEAD or the index) is what makes the
        # three cases collapse into one. `git checkout -- <path>` is deliberately
        # NOT used anywhere here: it rewrites the worktree from the INDEX, so it
        # reinstates the very staged edit this step exists to drop.
        BASE_REF="origin/${BASE_BRANCH}"

        # Everything that differs from base under a pathspec: committed on this
        # branch, staged/unstaged against HEAD, or a brand-new untracked file.
        changed_under() {
          {
            git diff --name-only "${BASE_REF}...HEAD" -- "$1" 2>/dev/null || true
            git diff --name-only HEAD -- "$1" 2>/dev/null || true
            git ls-files --others --exclude-standard -- "$1" 2>/dev/null || true
          } | sort -u
        }

        # Put one file back the way base has it (deleting it if base never had it).
        restore_from_base() {
          if git cat-file -e "${BASE_REF}:${1}" 2>/dev/null; then
            git checkout "$BASE_REF" -- "$1" 2>/dev/null || true
          else
            git rm -q -f --ignore-unmatch --cached -- "$1" >/dev/null 2>&1 || true
            rm -f -- "$1"
          fi
        }

        while IFS= read -r P; do
          [ -z "$P" ] && continue

          CHANGED=$(changed_under "$P")
          [ -z "$CHANGED" ] && continue

          echo "::warning::Agent modified protected path '$P' — stripping"
          echo "$CHANGED"

          while IFS= read -r f; do
            [ -z "$f" ] && continue
            restore_from_base "$f"
          done <<< "$CHANGED"
        done <<< "$IMMUTABLE_PATHS"

        # Optional allowlist: this lane may only write these prefixes, so revert
        # everything else. Immutable paths above are the floor no lane may cross;
        # this is the ceiling a narrow lane opts into.
        if [ -n "$ALLOWED_PATHS" ]; then
          ALLOWED=$(printf '%s' "$ALLOWED_PATHS" | tr ',' '\n' | sed 's/^[[:space:]]*//; s/[[:space:]]*$//' | grep -v '^$' || true)
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            KEEP=""
            while IFS= read -r A; do
              [ -z "$A" ] && continue
              case "$f" in
                "$A"|"$A"/*) KEEP=1; break ;;
                *) case "$A" in */) case "$f" in "$A"*) KEEP=1; break ;; esac ;; esac ;;
              esac
            done <<< "$ALLOWED"
            if [ -z "$KEEP" ]; then
              echo "::warning::Change to '$f' is outside this lane's allowed paths — reverting"
              restore_from_base "$f"
            fi
          done <<< "$(changed_under '.')"
        fi

        # Fold the restorations into the branch's tip commit — but only when there
        # IS a commit of our own to amend. With nothing ahead of base, `--amend`
        # would rewrite the base commit itself.
        if ! git diff --staged --quiet; then
          if [ "$(git rev-list "${BASE_REF}..HEAD" --count 2>/dev/null || echo 0)" -gt 0 ]; then
            # Amending fails when the restoration empties the tip commit — i.e. the
            # illegal edit WAS the whole commit. Drop that commit instead; anything
            # else the agent left behind is committed by the next step.
            git commit --amend --no-edit || git reset --soft HEAD~1
          else
            git commit -m "chore: strip edits to immutable paths"
          fi
        fi

    - name: Commit uncommitted changes
      shell: bash
      env:
        COMMIT_MSG: ${{ inputs.commit-message }}
        AGENT_NAME: ${{ inputs.agent-name }}
      run: |
        if [ -n "$(git status --porcelain)" ]; then
          echo "::notice::Agent left uncommitted changes, committing..."
          git add -A
          if [ -z "$COMMIT_MSG" ]; then
            COMMIT_MSG="Agent ${AGENT_NAME}: automated changes"
          fi
          git commit -m "$COMMIT_MSG"
        fi

    - name: Check for changes
      id: check
      shell: bash
      env:
        BASE_BRANCH: ${{ inputs.base-branch }}
      run: |
        if [ "$(git rev-list "origin/${BASE_BRANCH}..HEAD" --count)" -eq 0 ]; then
          echo "has_changes=false" >> "$GITHUB_OUTPUT"
        else
          echo "has_changes=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Post no-changes comment
      if: steps.check.outputs.has_changes == 'false' && inputs.no-changes-comment != ''
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        COMMENT_BODY: ${{ inputs.no-changes-comment }}
        COMMENT_TARGET: ${{ inputs.comment-target }}
        ISSUE_NUMBER: ${{ inputs.issue-number }}
        BRANCH: ${{ inputs.branch }}
      run: |
        if [ "$COMMENT_TARGET" = "issue" ] && [ -n "$ISSUE_NUMBER" ]; then
          gh issue comment "$ISSUE_NUMBER" --body "$COMMENT_BODY"
        elif [ "$COMMENT_TARGET" = "pr" ]; then
          PR_NUM=$(gh pr list --head "$BRANCH" --json number --jq '.[0].number // empty')
          if [ -n "$PR_NUM" ]; then
            gh pr comment "$PR_NUM" --body "$COMMENT_BODY"
          fi
        fi

    - name: Push branch
      if: steps.check.outputs.has_changes == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        BRANCH: ${{ inputs.branch }}
      run: |
        git push origin "$BRANCH"

    - name: Create PR if needed
      if: steps.check.outputs.has_changes == 'true' && inputs.pr-title != ''
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        PR_TITLE: ${{ inputs.pr-title }}
        PR_BODY: ${{ inputs.pr-body }}
        PR_LABEL: ${{ inputs.pr-label }}
        BRANCH: ${{ inputs.branch }}
        BASE_BRANCH: ${{ inputs.base-branch }}
        AGENT_NAME: ${{ inputs.agent-name }}
        ISSUE_NUMBER: ${{ inputs.issue-number }}
      run: |
        EXISTING_PR=$(gh pr list --head "$BRANCH" --json number --jq '.[0].number // empty')
        if [ -z "$EXISTING_PR" ]; then
          echo "::notice::Agent didn't create a PR, creating fallback..."
          PR_ARGS=(--title "$PR_TITLE" --base "$BASE_BRANCH" --head "$BRANCH")
          if [ -n "$PR_BODY" ]; then
            PR_ARGS+=(--body "$PR_BODY")
          fi
          if [ -n "$PR_LABEL" ]; then
            PR_ARGS+=(--label "$PR_LABEL")
          fi
          PR_URL=$(gh pr create "${PR_ARGS[@]}")

          if [ -n "$ISSUE_NUMBER" ]; then
            gh issue comment "$ISSUE_NUMBER" --body "Agent ${AGENT_NAME}: PR created: ${PR_URL}"
          fi
        fi
