name: Agent Context
description: Fetch and format GitHub issue/PR context for agent prompts

inputs:
  type:
    description: "Context type: issue, pr-diff, pr-review, pr-full"
    required: true
  number:
    description: Issue or PR number
    required: true
  token:
    description: GitHub token for API calls
    required: true
  include-diff:
    description: Whether to include the full diff (for PR types)
    default: "true"
  triggering-comment:
    description: Body of the comment that triggered the workflow
    default: ""
  sanitize:
    description: >-
      Neutralize prompt-injection in attacker-controlled text (issue/PR bodies,
      comments, review bodies, titles) before it is written to the context file:
      strips control/bidi sequences, caps length, neutralizes role-override
      markers, masks secret-looking strings, and wraps each body in a
      collision-proof fence inside an UNTRUSTED banner. On by default — the
      agent reading this file holds a write token and a shell. Set "false" only
      if the consumer sanitizes some other way.
    default: "true"
  base-branch:
    description: >-
      Optional base branch to note as the comparison base. The PR diff is always
      taken relative to the PR's own base ref; this input is surfaced for logging
      and downstream steps.
    default: ""

outputs:
  context-file:
    description: Path to the formatted context file

runs:
  using: node24
  main: dist/index.cjs
